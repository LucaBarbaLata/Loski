<!doctype html>
<!--
  Draws one of Loski's cards the way Discord shows it (dark theme), from the
  JSON Loski sends. render.mjs opens it as render.html?card=<name> and takes
  the screenshot; see src/discord/readme.rs for where the cards come from.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Loski card</title>
<style>
  @font-face { font-family: "Noto Sans"; src: url("/assets/fonts/NotoSans.ttf"); font-weight: 100 900; }
  :root {
    --bg: #313338; --card: #2b2d31; --edge: #3f4147; --text: #dbdee1; --head: #f2f3f5;
    --muted: #949ba4; --link: #00a8fc; --input: #1e1f22; --code: #2b2d31;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.375 "Noto Sans", sans-serif; }
  #message { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 16px; padding: 14px 18px 18px; width: 640px; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; }
  .head { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .name { color: var(--head); font-weight: 500; }
  .app { background: #5865f2; color: #fff; font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 4px; }
  .time { color: var(--muted); font-size: 12px; margin-left: 2px; }
  .card { position: relative; background: var(--card); border: 1px solid var(--edge); border-radius: 8px; padding: 14px 14px 14px 18px; display: grid; gap: 8px; width: 560px; overflow: hidden; }
  .card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--accent, #4e5058); }
  .text { overflow-wrap: anywhere; white-space: pre-wrap; }
  .text p { margin: 0; }
  .sub { font-size: 12px; color: var(--muted); line-height: 1.35; }
  .sub .emoji { width: 16px; height: 16px; }
  .h1 { font-size: 24px; font-weight: 700; color: var(--head); line-height: 1.25; margin: 4px 0 2px; }
  .h2 { font-size: 20px; font-weight: 700; color: var(--head); line-height: 1.25; margin: 4px 0 2px; }
  .h3 { font-size: 16px; font-weight: 700; color: var(--head); line-height: 1.3; margin: 2px 0; }
  strong { color: var(--head); font-weight: 700; }
  a { color: var(--link); text-decoration: none; }
  code { font: 85% "Consolas", monospace; background: var(--code); border: 1px solid #1e1f22; padding: 1px 4px; border-radius: 4px; }
  .emoji { width: 22px; height: 22px; vertical-align: -5px; object-fit: contain; }
  .mention { background: rgba(88, 101, 242, .3); color: #c9cdfb; border-radius: 3px; padding: 0 2px; font-weight: 500; }
  .section { display: flex; gap: 12px; align-items: flex-start; }
  .section > .stack { flex: 1; display: grid; gap: 6px; min-width: 0; }
  .thumb { width: 85px; height: 85px; border-radius: 8px; object-fit: cover; flex: none; }
  .gallery { display: grid; gap: 4px; }
  .gallery img { width: 100%; border-radius: 8px; display: block; }
  .divider { height: 1px; background: var(--edge); margin: 4px 0; }
  .gap { height: 4px; }
  .gap.large { height: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; min-width: 52px; padding: 0 14px; border-radius: 8px; color: #fff; font-size: 14px; font-weight: 500; white-space: nowrap; }
  .btn .emoji { width: 20px; height: 20px; vertical-align: 0; }
  .btn.s1 { background: #5865f2; } .btn.s2 { background: #4e5058; } .btn.s3 { background: #248046; } .btn.s4 { background: #da373c; } .btn.s5 { background: #4e5058; }
  .btn.off { opacity: .5; }
  .select { flex: 1; min-width: 0; height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 8px; background: var(--input); border: 1px solid #141517; font-size: 15px; color: var(--text); }
  .select.off { opacity: .5; }
  .select .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .select .placeholder { color: var(--muted); }
  .select .emoji { width: 20px; height: 20px; vertical-align: 0; }
  .select svg { width: 18px; height: 18px; flex: none; color: var(--text); }
  .chip { display: inline-flex; align-items: center; gap: 4px; background: #2b2d31; border-radius: 4px; padding: 1px 6px; margin-right: 4px; font-size: 14px; }
</style>
</head>
<body>
<div id="message"></div>
<script type="module">
const params = new URLSearchParams(location.search);
const card = await fetch(`/cards/${params.get("card")}.json`).then(r => r.json());
const names = await fetch("/cards/names.json").then(r => r.json());
const chevron = '<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const icon = name => `<img class="emoji" src="/assets/icons/${name}.png" alt="">`;
const emojiOf = e => !e ? "" : e.id ? icon(names.emoji[e.id] ?? e.name) : `<span>${esc(e.name)}</span>`;

function when(ts, style) {
  const date = new Date(ts * 1000);
  if (style === "R") {
    const mins = Math.round((names.now - ts) / 60);
    if (Math.abs(mins) < 1) return "just now";
    if (mins < 0) return `in ${-mins} minute${mins === -1 ? "" : "s"}`;
    if (mins < 60) return `${mins} minute${mins === 1 ? "" : "s"} ago`;
    const hours = Math.round(mins / 60);
    return `${hours} hour${hours === 1 ? "" : "s"} ago`;
  }
  return date.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Bucharest" });
}

// Discord's markdown, as much of it as Loski uses.
function inline(text) {
  const keep = [];
  const hold = html => `\u0000${keep.push(html) - 1}\u0000`;
  text = text
    .replace(/\\([\\*_`~|>\[\]()#-])/g, (_, c) => hold(esc(c)))
    .replace(/<a?:(\w+):(\d+)>/g, (_, name, id) => hold(icon(names.emoji[id] ?? name)))
    .replace(/<t:(\d+)(?::([tTdDfFR]))?>/g, (_, ts, style) => hold(`<span class="mention" style="background:rgba(255,255,255,.06);color:inherit;font-weight:400">${when(+ts, style)}</span>`))
    .replace(/<#(\d+)>/g, (_, id) => hold(`<span class="mention">#${esc(names.channels[id] ?? "channel")}</span>`))
    .replace(/<@&(\d+)>/g, (_, id) => hold(`<span class="mention">@${esc(names.roles[id] ?? "role")}</span>`))
    .replace(/<@!?(\d+)>/g, (_, id) => hold(`<span class="mention">@${esc(names.users[id] ?? "user")}</span>`))
    .replace(/`([^`]+)`/g, (_, code) => hold(`<code>${esc(code)}</code>`));
  text = esc(text)
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a>$1</a>')
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/__(.+?)__/g, "<u>$1</u>")
    .replace(/\*(.+?)\*/g, "<em>$1</em>")
    .replace(/~~(.+?)~~/g, "<s>$1</s>");
  return text.replace(/\u0000(\d+)\u0000/g, (_, i) => keep[+i]);
}

function markdown(content) {
  return content.split("\n").map(line => {
    for (const [mark, cls] of [["### ", "h3"], ["## ", "h2"], ["# ", "h1"], ["-# ", "sub"]]) {
      if (line.startsWith(mark)) return `<p class="${cls}">${inline(line.slice(mark.length))}</p>`;
    }
    return `<p>${inline(line) || "&nbsp;"}</p>`;
  }).join("");
}

function picked(select) {
  const values = select.default_values ?? [];
  if (select.type === 3) {
    const chosen = (select.options ?? []).find(o => o.default);
    return chosen ? `${emojiOf(chosen.emoji)}<span>${esc(chosen.label)}</span>` : null;
  }
  if (!values.length) return null;
  return values.map(v => {
    if (v.type === "channel") return `<span class="chip">#&nbsp;${esc(names.channels[v.id] ?? "channel")}</span>`;
    if (v.type === "role") return `<span class="chip">@${esc(names.roles[v.id] ?? "role")}</span>`;
    return `<span class="chip">${esc(names.users[v.id] ?? "user")}</span>`;
  }).join("");
}

function draw(c) {
  switch (c.type) {
    case 17: {
      const accent = c.accent_color != null ? `#${c.accent_color.toString(16).padStart(6, "0")}` : "#4e5058";
      return `<div class="card" style="--accent:${accent}">${c.components.map(draw).join("")}</div>`;
    }
    case 10: return `<div class="text">${markdown(c.content)}</div>`;
    case 9: return `<div class="section"><div class="stack">${c.components.map(draw).join("")}</div>${draw(c.accessory)}</div>`;
    case 11: return `<img class="thumb" src="/${c.media.url}" alt="">`;
    case 12: return `<div class="gallery" style="grid-template-columns:repeat(${Math.min(c.items.length, 2)},1fr)">${c.items.map(i => `<img src="/${i.media.url}" alt="">`).join("")}</div>`;
    case 14: return c.divider ? '<div class="divider"></div>' : `<div class="gap${c.spacing === 2 ? " large" : ""}"></div>`;
    case 1: return `<div class="row">${c.components.map(draw).join("")}</div>`;
    case 2: {
      const link = c.style === 5 ? '<svg viewBox="0 0 24 24" width="16" height="16"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' : "";
      return `<span class="btn s${c.style}${c.disabled ? " off" : ""}">${emojiOf(c.emoji)}${c.label ? `<span>${esc(c.label)}</span>` : ""}${link}</span>`;
    }
    case 3: case 5: case 6: case 7: case 8: {
      const shown = picked(c);
      return `<div class="select${c.disabled ? " off" : ""}"><span class="label">${shown ?? `<span class="placeholder">${esc(c.placeholder ?? "Make a selection")}</span>`}</span>${chevron}</div>`;
    }
    default: return "";
  }
}

const stamp = new Date(names.now * 1000).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Bucharest" });
document.getElementById("message").innerHTML = `
  <img class="avatar" src="/assets/avatar.png" alt="">
  <div><div class="head"><span class="name">Loski</span><span class="app">APP</span><span class="time">Today at ${stamp}</span></div>${draw(card)}</div>`;
await Promise.all([...document.images].map(img => img.complete ? null : new Promise(r => { img.onload = img.onerror = r; })));
await document.fonts.ready;
document.body.dataset.ready = "yes";
</script>
</body>
</html>
