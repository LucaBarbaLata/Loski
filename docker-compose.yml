services:
  loski:
    # Built and published by GitHub Actions; `loski update` downloads it.
    # `loski build` builds it from this folder instead.
    image: ghcr.io/lucabarbalata/loski:latest
    build: .
    container_name: loski
    env_file: .env
    environment:
      # Who ./data belongs to: you when loski.sh starts Loski on Linux, Loski's
      # own user (10001) otherwise. Loski sorts the folder out as it starts.
      LOSKI_UID: ${LOSKI_UID:-10001}
      LOSKI_GID: ${LOSKI_GID:-10001}
    volumes:
      - ./data:/data
    ports:
      # Only reachable from this computer; used for the one-time Spotify login.
      - "127.0.0.1:5588:5588"
      - "127.0.0.1:8898:8898"
    init: true
    restart: on-failure
    stop_grace_period: 5s
