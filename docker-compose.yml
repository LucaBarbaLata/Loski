services:
  loski:
    # Built and published by GitHub Actions; `loski update` downloads it.
    # `loski build` builds it from this folder instead.
    image: ghcr.io/lucabarbalata/loski:latest
    build: .
    container_name: loski
    env_file: .env
    environment:
      # Who ./data belongs to: you when loski.sh starts Loski on Linux, Loski's
      # own user (10001) otherwise. Loski sorts the folder out as it starts.
      LOSKI_UID: ${LOSKI_UID:-10001}
      LOSKI_GID: ${LOSKI_GID:-10001}
    volumes:
      - ./data:/data
    ports:
      # Only reachable from this computer; used for the one-time Spotify login.
      - "127.0.0.1:5588:5588"
      - "127.0.0.1:8898:8898"
    init: true
    restart: on-failure
    stop_grace_period: 5s

  # The graphics-card voice for talking back (beta): Chatterbox on an NVIDIA
  # card. Only with COMPOSE_PROFILES=gpu-voice in .env; see INSTALLATION.md.
  # Loski reaches it on this network only, at http://voice:8800.
  voice:
    profiles: [gpu-voice]
    build: ./voice
    image: loski-voice
    pull_policy: build
    container_name: loski-voice
    volumes:
      - voice-model:/models
    restart: on-failure
    stop_grace_period: 5s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  # The voice's model, about 3 GB, kept between updates.
  voice-model:
