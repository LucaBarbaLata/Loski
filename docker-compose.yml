services:
  loski:
    build: .
    image: loski:latest
    container_name: loski
    env_file: .env
    environment:
      # Days and months for /stats start at midnight here. Override with TIMEZONE in .env.
      TIMEZONE: ${TIMEZONE:-Europe/Bucharest}
    volumes:
      - ./data:/data
    ports:
      # Only reachable from this computer; used for the one-time Spotify login.
      - "127.0.0.1:5588:5588"
      - "127.0.0.1:8898:8898"
    init: true
    restart: on-failure
    stop_grace_period: 5s
