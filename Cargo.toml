[package]
name = "loski"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Loski: a private Spotify Premium music bot for Discord"
publish = false

[dependencies]
# Discord
twilight-gateway = { version = "0.17.1", default-features = false, features = ["rustls-webpki-roots", "twilight-http", "zstd"] }
twilight-http = { version = "0.17.1", default-features = false, features = ["rustls-webpki-roots", "decompression"] }
twilight-model = "0.17.1"
twilight-cache-inmemory = "0.17.1"
twilight-interactions = "0.17.1"
twilight-util = { version = "0.17.0", features = ["builder"] }
songbird = { version = "0.6.1", default-features = false, features = ["driver", "gateway", "rustls", "twilight", "tungstenite"] }
symphonia-core = "0.5"
# songbird decodes our raw f32 stream with symphonia's PCM codec, which is
# only compiled in when this feature is enabled somewhere in the build.
symphonia = { version = "0.5", default-features = false, features = ["pcm"] }
async-trait = "0.1"

# Spotify
librespot-core = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-playback = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-metadata = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-connect = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-protocol = "0.8.0"
protobuf = "3"

# Runtime and plumbing
tokio = { version = "1.54", features = ["full"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2.5"
parking_lot = "0.12"
rand = "0.9"
sha2 = "0.10"
base64 = "0.22"
url = "2"
dotenvy = "0.15"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ab_glyph = "0.2.32"
# Calendar days in your timezone, for /stats and the monthly recap.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[dev-dependencies]
twilight-validate = "0.17.0"
