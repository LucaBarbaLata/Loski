# Runs on every push: formatting, lint, tests, and a full Docker build, so a
# change that would break `loski update` shows up as a red cross first.
name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Format, lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install the libraries Loski builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake pkg-config libopus-dev

      # The same Rust as the Dockerfile.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

  docker:
    name: Docker image builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
